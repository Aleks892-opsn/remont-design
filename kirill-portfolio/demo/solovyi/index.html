<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0b">
<title>Soloviy — коттеджный посёлок под Оренбургом</title>
<meta name="description" content="Готовые дома 120, 138 и 170 м² в закрытом посёлке в 10 минутах от Оренбурга. Семейная ипотека. Запись на экскурсию.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="house-fg.webp">
<style>
  :root { --ink: #0b0b0b; --w: #fff; --w7: rgba(255,255,255,.72); --glass: rgba(14,14,14,.42); --e: cubic-bezier(.2,.8,.2,1); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: #000; color: var(--w); font: 500 15px/1.45 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; text-decoration: none; }

  .hero { background: rgb(185,189,198); position: relative; height: 100svh; min-height: 640px; overflow: hidden; isolation: isolate; }
  .ly { position: absolute; left: -22%; width: 136%; bottom: 17svh; aspect-ratio: 1206 / 1494; will-change: transform; }
  .ly img { width: 100%; height: 100%; display: block; }
  /* облака медленно плывут за домом */
  .sky img { animation: drift 26s ease-in-out infinite alternate; transform-origin: 50% 0; }
  @keyframes drift { from { transform: scale(1.06) translateX(-2.2%); } to { transform: scale(1.06) translateX(2.2%); } }
  .dim { position: absolute; inset: 0; background: linear-gradient(rgba(8,8,8,.62) 0%, rgba(8,8,8,.38) 30%, rgba(8,8,8,0) 52%); }
  .shade { position: absolute; inset: 0; z-index: 3; pointer-events: none; background: linear-gradient(rgba(0,0,0,0) 46%, rgba(0,0,0,.4) 62%, rgba(0,0,0,.9) 76%, #000 82%); }

  .title { position: absolute; z-index: 1; left: 50%; top: 16.5svh; width: max-content; transform: translateX(-50%); font: 800 100px/.8 "Big Shoulders Display", Impact, sans-serif; text-transform: uppercase; white-space: nowrap; color: var(--w); }
  .title span { display: inline-block; }
  .fg { z-index: 2; }

  /* шапка */
  .hd { position: absolute; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 11px; line-height: 1.3; letter-spacing: .16em; text-transform: uppercase; }
  .brand img { width: 44px; height: 44px; display: block; border-radius: 50%; box-shadow: 0 0 0 1px rgba(255,255,255,.35); }
  .call { width: 44px; height: 44px; border-radius: 50%; background: var(--w); color: var(--ink); display: grid; place-items: center; }
  .call svg { width: 19px; height: 19px; }

  /* плашки-стекло */
  .chip { position: absolute; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 8px 13px 8px 8px; border-radius: 999px; background: var(--glass); border: 1px solid rgba(255,255,255,.22); -webkit-backdrop-filter: blur(14px) saturate(140%); backdrop-filter: blur(14px) saturate(140%); font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip i { width: 24px; height: 24px; border-radius: 50%; background: var(--w); color: var(--ink); display: grid; place-items: center; flex: none; }
  .chip i svg { width: 13px; height: 13px; }
  .c1 { left: 14px; top: 63svh; }
  .c2 { right: 14px; top: 56svh; }

  /* низ */
  .bt { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 0 16px max(18px, env(safe-area-inset-bottom)); }
  .run { overflow: hidden; margin: 0 -16px 16px; padding: 9px 0; border-top: 1px solid rgba(255,255,255,.18); border-bottom: 1px solid rgba(255,255,255,.18); font-size: 12px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--w7); }
  .run div { display: flex; width: max-content; animation: run 22s linear infinite; }
  .run span { padding-right: 22px; }
  .run span::after { content: "✦"; padding-left: 22px; color: var(--w); }
  @keyframes run { to { transform: translateX(-50%); } }
  .lbl { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--w7); margin-bottom: 4px; }
  .sizes { display: flex; align-items: flex-end; margin-bottom: 16px; }
  .sizes div { flex: 1; }
  .sizes div + div { padding-left: 14px; border-left: 1px solid rgba(255,255,255,.28); margin-left: 14px; }
  .sizes b { font: 800 52px/.9 "Big Shoulders Display", Impact, sans-serif; letter-spacing: -.01em; }
  .sizes small { font-size: 14px; font-weight: 600; margin-left: 3px; color: var(--w7); }
  .cta { position: relative; overflow: hidden; height: 60px; border-radius: 18px; background: var(--w); color: var(--ink); display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; font-weight: 700; font-size: 16px; transition: transform .2s; }
  .cta:active { transform: scale(.98); }
  .cta span { width: 44px; height: 44px; border-radius: 13px; background: var(--ink); color: var(--w); display: grid; place-items: center; }
  .cta svg { width: 18px; height: 18px; }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(0,0,0,.08), transparent); animation: shine 4.5s 3s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  .tel { margin-top: 12px; text-align: center; font-size: 14px; color: var(--w7); }
  .tel a { color: var(--w); font-weight: 700; }

  /* заставка */
  .intro { position: fixed; inset: 0; z-index: 50; background: var(--ink); display: grid; place-items: center; pointer-events: none; clip-path: circle(150% at 50% 50%); }
  .intro img { width: 92px; height: 92px; opacity: 0; transform: scale(.85); }
  .js .intro img { animation: lg .9s var(--e) .1s forwards; }
  @keyframes lg { to { opacity: 1; transform: none; } }
  .ld .intro { clip-path: circle(0% at 50% 50%); transition: clip-path 1.1s cubic-bezier(.7,0,.2,1) .95s; }

  /* появление */
  .js .title span { transform: translateY(85%); opacity: 0; filter: blur(10px); }
  .js .chip, .js .bt > *, .js .hd { opacity: 0; filter: blur(10px); transform: translateY(18px); }
  .js .hero > .ly { transform: scale(1.14); }
  .ld .title span { transform: none; opacity: 1; filter: blur(0); transition: transform 1.3s var(--e), opacity .9s, filter .9s; }
  .ld .chip, .ld .bt > *, .ld .hd { opacity: 1; filter: blur(0); transform: none; transition: opacity .9s, filter .9s, transform 1s var(--e); }
  .ld .hero > .ly { transform: scale(1); transition: transform 2.6s var(--e) .9s; }
  .chip.fl { animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-7px); } }
  @media (prefers-reduced-motion: reduce) { .intro { display: none; } .js *, .js *::after { transition: none !important; animation: none !important; filter: none !important; opacity: 1 !important; } .js .title span, .js .chip, .js .bt > *, .js .hd, .js .ly { transform: none !important; } }

  /* компьютер: временно колонка по центру, полноценная версия позже */
  @media (min-width: 700px) { .hero { max-width: 480px; margin: 0 auto; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><img src="logo.png" alt=""></div>

<main class="hero" id="hero">
  <div class="ly sky"><img src="sky.webp" alt="" width="1206" height="1494"></div>
  <div class="dim"></div>
  <h1 class="title" id="title" aria-label="Soloviy — коттеджный посёлок под Оренбургом"><span>S</span><span>o</span><span>l</span><span>o</span><span>v</span><span>i</span><span>y</span></h1>
  <div class="ly fg" id="fg"><img src="house-fg.webp" alt="Двухэтажный дом с террасой в посёлке Soloviy" width="1206" height="1494" fetchpriority="high"></div>
  <div class="shade"></div>

  <header class="hd">
    <a class="brand" href="#"><img src="logo.png" alt="Логотип Soloviy" width="44" height="44">Коттеджный<br>посёлок</a>
    <a class="call" href="tel:+79228993550" aria-label="Позвонить 8 (922) 899-35-50"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>
  </header>

  <div class="chip c1"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i>10 минут до Оренбурга</div>
  <div class="chip c2"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></i>Закрытая территория</div>

  <div class="bt">
    <div class="run" aria-hidden="true"><div><span>Готовые дома</span><span>Семейная ипотека</span><span>Закрытая территория</span><span>10 минут до Оренбурга</span><span>Готовые дома</span><span>Семейная ипотека</span><span>Закрытая территория</span><span>10 минут до Оренбурга</span></div></div>
    <p class="lbl">Готовые дома</p>
    <div class="sizes"><div><b>120</b><small>м²</small></div><div><b>138</b><small>м²</small></div><div><b>170</b><small>м²</small></div></div>
    <a class="cta" href="https://t.me/ElenaYurevna13" target="_blank" rel="noopener">Записаться на экскурсию<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <p class="tel">или позвоните <a href="tel:+79228993550">8 (922) 899-35-50</a></p>
  </div>
</main>

<script>
(function () {
  var d = document.documentElement, t = document.getElementById('title'), h = document.getElementById('hero');
  d.classList.add('js');
  function fit() { t.style.fontSize = '100px'; t.style.fontSize = (100 * (h.clientWidth - 24) / t.scrollWidth) + 'px'; }
  var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([ready, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
    fit();
    var base = 1.5;
    [].forEach.call(t.children, function (s, i) { s.style.transitionDelay = (base + i * 0.07) + 's'; });
    document.querySelector('.hd').style.transitionDelay = (base + .3) + 's';
    [].forEach.call(document.querySelectorAll('.bt > *'), function (c, i) { c.style.transitionDelay = (base + .45 + i * .09) + 's'; });
    [].forEach.call(document.querySelectorAll('.chip'), function (c, i) {
      c.style.transitionDelay = (base + 1 + i * .2) + 's';
      setTimeout(function () { c.classList.add('fl'); c.style.animationDelay = (i * 1.2) + 's'; }, (base + 2.1 + i * .2) * 1000);
    });
    requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.add('ld'); }); });
  });
  addEventListener('resize', fit);
})();
</script>
</body>
</html>
