<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soloviy — коттеджный посёлок под Оренбургом</title>
<meta name="description" content="Готовые дома 120, 138 и 170 м² в закрытом посёлке в 10 минутах от Оренбурга. Семейная ипотека. Запись на экскурсию.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="house-fg.webp">
<style>
  :root { --ink: #0b0b0b; --paper: #fff; --mute: #6d6d6d; --line: #e6e6e6; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--paper); color: var(--ink); font: 500 15px/1.45 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* шапка */
  .hd { position: absolute; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 11px; line-height: 1.25; letter-spacing: .14em; text-transform: uppercase; }
  .brand img { width: 42px; height: 42px; display: block; }
  .call { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: grid; place-items: center; }
  .call svg { width: 19px; height: 19px; }

  /* сцена: небо → надпись → дом */
  .hero { min-height: 100svh; display: flex; flex-direction: column; }
  .stage { position: relative; margin-top: 70px; aspect-ratio: 1206 / 1494; overflow: hidden; }
  .stage .ly { position: absolute; inset: 0; will-change: transform; }
  .sky { background: url(sky.webp) top / 100% auto no-repeat; }
  .sky::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 28%; background: linear-gradient(#fff, rgba(255,255,255,0)); }
  .fg img { width: 100%; height: 100%; display: block; }
  .title { position: absolute; left: 50%; top: 11.5%; width: max-content; transform: translateX(-50%); font: 800 100px/0.82 "Big Shoulders Display", Impact, sans-serif; text-transform: uppercase; letter-spacing: -.005em; white-space: nowrap; color: var(--ink); }
  .title span { display: inline-block; }

  /* плашки */
  .chip { position: absolute; z-index: 4; display: flex; align-items: center; gap: 8px; padding: 9px 13px 9px 10px; background: rgba(255,255,255,.94); border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; box-shadow: 0 8px 24px rgba(0,0,0,.14); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); }
  .chip i { width: 22px; height: 22px; border-radius: 50%; background: var(--ink); display: grid; place-items: center; flex: none; }
  .chip i svg { width: 12px; height: 12px; color: #fff; }
  .c1 { left: 16px; top: 66%; }
  .c2 { right: 16px; top: 75.5%; }
  .c3 { left: 16px; top: 85%; }

  /* низ */
  .bt { padding: 18px 16px max(20px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
  .lbl { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; color: var(--mute); }
  .sizes { display: grid; grid-template-columns: repeat(3, 1fr); border: 1.5px solid var(--ink); border-radius: 16px; overflow: hidden; }
  .sizes div { padding: 10px 0 9px; text-align: center; }
  .sizes div + div { border-left: 1.5px solid var(--ink); }
  .sizes b { font: 800 34px/1 "Big Shoulders Display", Impact, sans-serif; }
  .sizes small { font-size: 13px; font-weight: 600; margin-left: 2px; }
  .cta { height: 58px; border-radius: 16px; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; font-weight: 700; font-size: 16px; transition: transform .2s; }
  .cta:active { transform: scale(.98); }
  .cta span { width: 42px; height: 42px; border-radius: 12px; background: #fff; color: var(--ink); display: grid; place-items: center; }
  .cta svg { width: 18px; height: 18px; }
  .tel { text-align: center; font-size: 14px; color: var(--mute); }
  .tel a { color: var(--ink); font-weight: 700; }

  /* появление */
  .js .title span { transform: translateY(70%); opacity: 0; filter: blur(8px); }
  .js .chip, .js .bt > * { opacity: 0; filter: blur(10px); transform: translateY(16px); }
  .js .stage .ly { transform: scale(1.08); }
  .ld .title span { transform: none; opacity: 1; filter: blur(0); transition: transform 1.1s cubic-bezier(.2,.8,.2,1), opacity .8s, filter .8s; }
  .ld .chip, .ld .bt > * { opacity: 1; filter: blur(0); transform: none; transition: opacity .8s, filter .8s, transform .9s cubic-bezier(.2,.8,.2,1); }
  .ld .stage .ly { transform: scale(1); transition: transform 2.2s cubic-bezier(.2,.8,.2,1); }
  .ld .chip.fl { animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { .js * { transition: none !important; animation: none !important; transform: none !important; filter: none !important; opacity: 1 !important; } }

  /* компьютер: временно — колонка по центру, полноценная версия позже */
  @media (min-width: 700px) {
    body { background: #f2f2f2; }
    .wrap { max-width: 480px; margin: 0 auto; background: #fff; position: relative; box-shadow: 0 0 60px rgba(0,0,0,.06); }
  }
</style>
</head>
<body>
<div class="wrap">
<header class="hd">
  <a class="brand" href="#"><img src="logo.png" alt="Логотип Soloviy" width="42" height="42">Коттеджный<br>посёлок</a>
  <a class="call" href="tel:+79228993550" aria-label="Позвонить 8 (922) 899-35-50"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>
</header>

<main class="hero">
  <div class="stage" id="stage">
    <div class="ly sky" id="sky"></div>
    <h1 class="title" id="title" aria-label="Soloviy — коттеджный посёлок под Оренбургом"><span>S</span><span>o</span><span>l</span><span>o</span><span>v</span><span>i</span><span>y</span></h1>
    <div class="ly fg" id="fg"><img src="house-fg.webp" alt="Двухэтажный дом с террасой в посёлке Soloviy" width="1206" height="1494" fetchpriority="high"></div>

    <div class="chip c1"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg></i>Закрытая территория</div>
    <div class="chip c2"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></i>10 минут до Оренбурга</div>
    <div class="chip c3"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg></i>Семейная ипотека</div>
  </div>

  <div class="bt">
    <p class="lbl"><span>Готовые дома</span><span>Под Оренбургом</span></p>
    <div class="sizes"><div><b>120</b><small>м²</small></div><div><b>138</b><small>м²</small></div><div><b>170</b><small>м²</small></div></div>
    <a class="cta" href="https://t.me/ElenaYurevna13" target="_blank" rel="noopener">Записаться на экскурсию<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    <p class="tel">или позвоните <a href="tel:+79228993550">8 (922) 899-35-50</a></p>
  </div>
</main>
</div>

<script>
(function () {
  var d = document.documentElement, t = document.getElementById('title'), st = document.getElementById('stage');
  d.classList.add('js');
  // надпись ровно на ширину сцены
  function fit() { t.style.fontSize = '100px'; var w = st.clientWidth - 28; t.style.fontSize = (100 * w / t.scrollWidth) + 'px'; }
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(function () {
    fit();
    [].forEach.call(t.children, function (s, i) { s.style.transitionDelay = (0.25 + i * 0.07) + 's'; });
    var ch = document.querySelectorAll('.chip'), bt = document.querySelectorAll('.bt > *');
    [].forEach.call(ch, function (c, i) { c.style.transitionDelay = (1 + i * 0.18) + 's'; c.style.animationDelay = (2 + i * 0.9) + 's'; setTimeout(function () { c.classList.add('fl'); }, 2000 + i * 180); });
    [].forEach.call(bt, function (c, i) { c.style.transitionDelay = (0.6 + i * 0.1) + 's'; });
    requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.add('ld'); }); });
  });
  addEventListener('resize', fit);
})();
</script>
</body>
</html>
