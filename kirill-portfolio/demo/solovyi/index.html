<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f0e6">
<title>Soloviy — коттеджный посёлок под Оренбургом</title>
<meta name="description" content="Готовые дома 120, 138 и 170 м² в закрытом посёлке в 10 минутах от Оренбурга. Семейная ипотека. Запись на экскурсию.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="house-fg.webp">
<style>
  /* цвета взяты с логотипа «Соловьи»: бронзовый круг, шоколадная надпись, тёплое небо */
  :root { --choc: #3b2a20; --choc6: rgba(59,42,32,.62); --line: rgba(59,42,32,.16); --cream: #f6f0e6; --cream2: #ede4d6;
          --bronze: linear-gradient(105deg, #5e3d24 0%, #9a6b37 38%, #c79b5c 55%, #8d6034 75%, #4f3220 100%);
          --e: cubic-bezier(.2,.8,.2,1); --cond: "Big Shoulders Display", Impact, sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--cream); color: var(--choc); font: 500 15px/1.45 Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a, button { color: inherit; text-decoration: none; font: inherit; }
  button { background: none; border: 0; cursor: pointer; }

  .hero { position: relative; height: 100svh; min-height: 560px; overflow: hidden; isolation: isolate; background: linear-gradient(rgb(185,189,198) 50%, var(--cream) 50%); }
  /* положение фото и надписи считает скрипт — от нижнего блока, чтобы ничего не наезжало */
  .ly { position: absolute; aspect-ratio: 1206 / 1494; will-change: transform; }
  .ly img { width: 100%; height: 100%; display: block; }
  .sky img { animation: drift 26s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: scale(1.06) translateX(-2.2%); } to { transform: scale(1.06) translateX(2.2%); } }
  .title { position: absolute; z-index: 1; left: 50%; top: 0; width: max-content; transform: translateX(-50%); font: 800 100px/.8 var(--cond); text-transform: uppercase; white-space: nowrap; color: var(--choc); }
  .title span { display: inline-block; }
  .fg { z-index: 2; }

  .hd { position: absolute; z-index: 10; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: max(14px, env(safe-area-inset-top)) 16px 0; }
  .brand img { width: 46px; height: 46px; display: block; border-radius: 50%; box-shadow: 0 4px 14px rgba(59,42,32,.25); }
  .call { width: 46px; height: 46px; border-radius: 50%; background: var(--bronze); color: var(--cream); display: grid; place-items: center; box-shadow: 0 4px 14px rgba(59,42,32,.25); }
  .call svg { width: 19px; height: 19px; }

  /* нижний блок — кремовая панель */
  .bt { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; padding: 20px 16px max(22px, env(safe-area-inset-bottom)); display: none; background: var(--cream); border-radius: 26px 26px 0 0; box-shadow: 0 -12px 34px rgba(59,42,32,.16); }
  [data-v="1"] .b1, [data-v="2"] .b2, [data-v="3"] .b3, [data-v="4"] .b4 { display: block; }
  .lbl { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--choc6); }
  .cta { position: relative; overflow: hidden; height: 60px; border-radius: 18px; background: var(--bronze); color: var(--cream); display: flex; align-items: center; justify-content: space-between; padding: 0 8px 0 20px; font-weight: 700; font-size: 16px; transition: transform .2s; box-shadow: 0 10px 24px rgba(94,61,36,.28); }
  .cta:active { transform: scale(.98); }
  .cta > span { width: 44px; height: 44px; border-radius: 13px; background: var(--cream); color: var(--choc); display: grid; place-items: center; flex: none; }
  .cta svg { width: 18px; height: 18px; }
  .cta::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -60%; background: linear-gradient(100deg, transparent, rgba(255,240,210,.35), transparent); animation: shine 4.5s 3s ease-in-out infinite; }
  @keyframes shine { 0%, 60% { left: -60%; } 100% { left: 130%; } }

  /* 1 — крупные цифры */
  .sizes { display: flex; align-items: flex-end; margin: 6px 0 18px; }
  .sizes div { flex: 1; }
  .sizes div + div { padding-left: 14px; border-left: 1px solid var(--line); margin-left: 14px; }
  .sizes b { font: 800 52px/.9 var(--cond); }
  .sizes small { font-size: 14px; font-weight: 700; margin-left: 3px; color: #9a6b37; }

  /* 2 — карточки домов, листаются */
  .b2 .row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .b2 .row em { font-style: normal; font-size: 13px; color: var(--choc6); }
  .cards { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -16px 14px; padding: 0 16px; scrollbar-width: none; }
  .cards::-webkit-scrollbar { display: none; }
  .card { flex: 0 0 42%; scroll-snap-align: start; border-radius: 20px; padding: 14px 14px 12px; background: var(--cream2); text-align: left; transition: color .35s, transform .35s var(--e); position: relative; overflow: hidden; }
  .card::before { content: ""; position: absolute; inset: 0; background: var(--bronze); opacity: 0; transition: opacity .35s; }
  .card > * { position: relative; }
  .card b { display: block; font: 800 50px/.85 var(--cond); }
  .card b small { font: 700 14px Manrope, sans-serif; margin-left: 3px; }
  .card p { margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
  .card p i { width: 26px; height: 26px; border-radius: 50%; border: 1px solid currentColor; display: grid; place-items: center; }
  .card p i svg { width: 12px; height: 12px; }
  .card.on { color: var(--cream); }
  .card.on::before { opacity: 1; }
  .card:active { transform: scale(.97); }

  /* 3 — переключатель площади */
  .seg { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); padding: 4px; border-radius: 16px; background: var(--cream2); margin: 8px 0 14px; }
  .seg .pill { position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3); border-radius: 12px; background: var(--bronze); transition: transform .5s var(--e); }
  .seg button { position: relative; height: 50px; font: 800 30px/1 var(--cond); transition: color .35s; }
  .seg button small { font: 700 12px Manrope, sans-serif; margin-left: 2px; }
  .seg button.on { color: var(--cream); }

  /* 4 — минимал с круглой кнопкой */
  .b4 .wrap4 { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .b4 .big { font: 800 46px/.9 var(--cond); margin: 6px 0 4px; white-space: nowrap; }
  .b4 .big i { font-style: normal; color: #c79b5c; }
  .b4 .sub { font-size: 13px; color: var(--choc6); }
  .ring { position: relative; flex: none; width: 116px; height: 116px; border-radius: 50%; display: grid; place-items: center; }
  .ring svg.txt { position: absolute; inset: 0; width: 100%; height: 100%; animation: spin 14s linear infinite; }
  .ring svg.txt text { fill: #8d6034; font: 700 10.4px Manrope, sans-serif; text-transform: uppercase; }
  .ring span { width: 66px; height: 66px; border-radius: 50%; background: var(--bronze); color: var(--cream); display: grid; place-items: center; transition: transform .35s var(--e); box-shadow: 0 8px 20px rgba(94,61,36,.3); }
  .ring span svg { width: 24px; height: 24px; transform: rotate(-45deg); }
  .ring:active span { transform: scale(.92); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* переключатель вариантов (только в демо) */
  .vs { position: fixed; z-index: 60; right: 70px; top: max(20px, calc(env(safe-area-inset-top) + 6px)); display: none; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(59,42,32,.55); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .demo .vs { display: flex; }
  .vs button { width: 28px; height: 28px; border-radius: 50%; font-weight: 700; font-size: 14px; color: var(--cream); }
  .vs button.on { background: var(--cream); color: var(--choc); }

  /* заставка */
  .intro { position: fixed; inset: 0; z-index: 50; background: var(--cream); display: grid; place-items: center; pointer-events: none; clip-path: circle(150% at 50% 50%); }
  .intro img { width: 96px; height: 96px; opacity: 0; transform: scale(.85); border-radius: 50%; }
  .js .intro img { animation: lg .9s var(--e) .1s forwards; }
  @keyframes lg { to { opacity: 1; transform: none; } }
  .ld .intro { clip-path: circle(0% at 50% 50%); transition: clip-path 1.1s cubic-bezier(.7,0,.2,1) .95s; }

  /* появление */
  .js .title span { transform: translateY(85%); opacity: 0; filter: blur(10px); }
  .js .bt .in, .js .hd { opacity: 0; filter: blur(10px); transform: translateY(18px); }
  .js .bt { transform: translateY(100%); }
  .js .ly { scale: 1.14; }
  .ld .title span { transform: none; opacity: 1; filter: blur(0); transition: transform 1.3s var(--e), opacity .9s, filter .9s; }
  .ld .bt .in, .ld .hd { opacity: 1; filter: blur(0); transform: none; transition: opacity .9s, filter .9s, transform 1s var(--e); }
  .ld .bt { transform: none; transition: transform 1.1s var(--e) 1.7s; }
  .ld .ly { scale: 1; transition: scale 2.6s var(--e) .9s; }
  .bt .in.re { animation: re .7s var(--e) both; }
  @keyframes re { from { opacity: 0; filter: blur(10px); transform: translateY(18px); } }
  @media (prefers-reduced-motion: reduce) { .intro { display: none; } .js *, .js *::after { transition: none !important; animation: none !important; filter: none !important; opacity: 1 !important; } .js .title span, .js .bt, .js .bt .in, .js .hd { transform: none !important; } .js .ly { scale: 1 !important; } }

  @media (min-width: 700px) { .hero { max-width: 480px; margin: 0 auto; } }
</style>
</head>
<body>
<div class="intro" aria-hidden="true"><img src="logo-bronze.png" alt=""></div>

<main class="hero" id="hero" data-v="1">
  <div class="ly sky"><img src="sky.webp" alt="" width="1206" height="1494"></div>
  <h1 class="title" id="title" aria-label="Soloviy — коттеджный посёлок под Оренбургом"><span>S</span><span>o</span><span>l</span><span>o</span><span>v</span><span>i</span><span>y</span></h1>
  <div class="ly fg"><img src="house-fg.webp" alt="Двухэтажный дом с террасой в посёлке Soloviy" width="1206" height="1494" fetchpriority="high"></div>

  <header class="hd">
    <a class="brand" href="#"><img src="logo-bronze.png" alt="Логотип Soloviy" width="44" height="44"></a>
    <a class="call" href="tel:+79228993550" aria-label="Позвонить 8 (922) 899-35-50"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></a>
  </header>

  <!-- 1: бегущая строка + цифры -->
  <div class="bt b1">
    <p class="lbl in">Готовые дома</p>
    <div class="sizes in"><div><b>120</b><small>м²</small></div><div><b>138</b><small>м²</small></div><div><b>170</b><small>м²</small></div></div>
    <a class="cta in" href="https://t.me/ElenaYurevna13" target="_blank" rel="noopener">Записаться на экскурсию<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  </div>

  <!-- 2: карточки домов -->
  <div class="bt b2">
    <div class="row in"><p class="lbl">Готовые дома</p><em>листайте →</em></div>
    <div class="cards in">
      <button class="card on" type="button"><b>120<small>м²</small></b><p>Готовый дом<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg></i></p></button>
      <button class="card" type="button"><b>138<small>м²</small></b><p>Готовый дом<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg></i></p></button>
      <button class="card" type="button"><b>170<small>м²</small></b><p>Готовый дом<i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M7 17L17 7M9 7h8v8"/></svg></i></p></button>
    </div>
    <a class="cta in" href="https://t.me/ElenaYurevna13" target="_blank" rel="noopener">Записаться на экскурсию<span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
  </div>

  <!-- 3: стеклянная панель -->
  <div class="bt b3">
    <div class="sheet in">
      <p class="lbl">Выберите дом</p>
      <div class="seg" id="seg"><i class="pill"></i><button class="on" type="button">120<small>м²</small></button><button type="button">138<small>м²</small></button><button type="button">170<small>м²</small></button></div>
      <a class="cta" href="https://t.me/ElenaYurevna13" target="_blank" rel="noopener"><em id="segTxt" style="font-style:normal">Посмотреть дом 120 м² вживую</em><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></a>
    </div>
  </div>

  <!-- 4: минимал с круглой кнопкой -->
  <div class="bt b4">
    <div class="wrap4 in">
      <div>
        <p class="lbl">Готовые дома</p>
        <p class="big">120 <i>/</i> 138 <i>/</i> 170</p>
        <p class="sub">м² · семейная ипотека</p>
      </div>
      <a class="ring" href="https://t.me/ElenaYurevna13" target="_blank" rel="noopener" aria-label="Записаться на экскурсию">
        <svg class="txt" viewBox="0 0 116 116" aria-hidden="true"><defs><path id="cp" d="M58 58 m-49 0 a49 49 0 1 1 98 0 a49 49 0 1 1 -98 0"/></defs><text><textPath href="#cp" textLength="304" lengthAdjust="spacing">Записаться на экскурсию ·</textPath></text></svg>
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
      </a>
    </div>
  </div>
</main>

<div class="vs" id="vs" aria-label="Варианты"><button class="on" type="button">1</button><button type="button">2</button><button type="button">3</button><button type="button">4</button></div>

<script>
(function () {
  var d = document.documentElement, h = document.getElementById('hero'), t = document.getElementById('title'),
      lys = h.querySelectorAll('.ly'), hd = h.querySelector('.hd');
  d.classList.add('js');
  var q = new URLSearchParams(location.search);
  if (q.has('demo') || !/vercel\.app$/.test(location.hostname)) d.classList.add('demo');
  if (/^[1-4]$/.test(q.get('v'))) h.dataset.v = q.get('v');

  function bt() { return h.querySelector('.b' + h.dataset.v); }

  // всё считается от верха нижнего блока: фото, надпись, плашки
  function layout() {
    var W = h.clientWidth, H = h.clientHeight, top = H - bt().offsetHeight;
    t.style.fontSize = '100px';
    var fs = 100 * (W - 24) / t.scrollWidth, th = fs * 0.8;
    var hdB = hd.offsetTop + hd.offsetHeight + Math.max(28, H * 0.06), roofMin = hdB + th * 0.8;
    var ground = top + (H - top) * 0.75;                 // низ фото уходит под нижний блок
    var bw = Math.max(W * 1.25, ground / 1.15 * 1206 / 1494), bh = bw * 1494 / 1206;
    if (ground - bh * 0.722 < roofMin) {                 // экран низкий: опускаем дом под нижний блок
      ground = Math.min(H, roofMin + bh * 0.722);
      if (ground - bh * 0.722 < roofMin) { bh = Math.max(W * 1.05 * 1494 / 1206, (ground - roofMin) / 0.722); bw = bh * 1206 / 1494; }
    }
    var by = ground - bh, bx = W * 0.5 - bw * 0.56;
    [].forEach.call(lys, function (l) { l.style.width = bw + 'px'; l.style.left = bx + 'px'; l.style.top = by + 'px'; });
    if (by > 0) {                                        // небо тянем до самого верха, без полосы
      var sw = bw * ground / bh, sk = h.querySelector('.sky');
      sk.style.width = sw + 'px'; sk.style.left = (bx + bw * 0.56 - sw * 0.56) + 'px'; sk.style.top = '0px';
    }
    var roof = by + bh * 0.278;
    if (roof - th * 0.8 < hdB) { th = Math.max(56, (roof - hdB) / 0.8); fs = th / 0.8; }
    t.style.fontSize = fs + 'px';
    t.style.top = Math.max(hdB, roof - th * 0.82) + 'px';
  }

  function enter(el, delay) {
    [].forEach.call(el.querySelectorAll('.in'), function (c, i) { c.style.transitionDelay = (delay + i * .09) + 's'; });
  }

  var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
  Promise.race([ready, new Promise(function (r) { setTimeout(r, 1500); })]).then(function () {
    layout();
    var base = 1.5;
    [].forEach.call(t.children, function (s, i) { s.style.transitionDelay = (base + i * 0.07) + 's'; });
    hd.style.transitionDelay = (base + .3) + 's';
    enter(bt(), base + .45);
    requestAnimationFrame(function () { requestAnimationFrame(function () { d.classList.add('ld'); }); });
  });
  addEventListener('resize', layout);

  // переключение вариантов
  var vs = document.getElementById('vs').children;
  [].forEach.call(vs, function (b, i) {
    if (String(i + 1) === h.dataset.v) { [].forEach.call(vs, function (x) { x.classList.remove('on'); }); b.classList.add('on'); }
    b.addEventListener('click', function () {
      [].forEach.call(vs, function (x) { x.classList.remove('on'); }); b.classList.add('on');
      h.dataset.v = i + 1; layout();
      [].forEach.call(bt().querySelectorAll('.in'), function (c, k) { c.style.transitionDelay = ''; c.classList.remove('re'); void c.offsetWidth; c.style.animationDelay = (k * .07) + 's'; c.classList.add('re'); });
    });
  });

  // 2: выбор карточки
  var cards = h.querySelectorAll('.card');
  [].forEach.call(cards, function (c) { c.addEventListener('click', function () { [].forEach.call(cards, function (x) { x.classList.remove('on'); }); c.classList.add('on'); }); });

  // 3: переключатель площади
  var seg = document.getElementById('seg'), pill = seg.querySelector('.pill'), sb = seg.querySelectorAll('button'), st = document.getElementById('segTxt');
  [].forEach.call(sb, function (b, i) { b.addEventListener('click', function () {
    [].forEach.call(sb, function (x) { x.classList.remove('on'); }); b.classList.add('on');
    pill.style.transform = 'translateX(' + (i * 100) + '%)';
    st.textContent = 'Посмотреть дом ' + b.firstChild.nodeValue + ' м² вживую';
  }); });
})();
</script>
</body>
</html>
