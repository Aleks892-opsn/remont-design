<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1000 1000" role="img" aria-label="Колесо: шина с литым диском">
  <!-- Колесо в боковой проекции: шина, надпись на боковине, литой диск с десятью спицами.
       Свет — тёплый красный ключ слева и холодный блик сверху, как в тёмной студийной съёмке. -->
  <defs>
    <radialGradient id="rubber" cx="50%" cy="50%" r="50%">
      <stop offset="0.66" stop-color="#0d0d10"/>
      <stop offset="0.80" stop-color="#1b1b20"/>
      <stop offset="0.93" stop-color="#121216"/>
      <stop offset="1" stop-color="#070709"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dbe0"/>
      <stop offset="0.35" stop-color="#8b8f98"/>
      <stop offset="0.55" stop-color="#3b3d44"/>
      <stop offset="0.8" stop-color="#9da1aa"/>
      <stop offset="1" stop-color="#2a2b30"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5d6068"/>
      <stop offset="0.45" stop-color="#c9ccd2"/>
      <stop offset="0.6" stop-color="#7b7f88"/>
      <stop offset="1" stop-color="#2c2d33"/>
    </linearGradient>
    <radialGradient id="barrel" cx="50%" cy="50%" r="50%">
      <stop offset="0.2" stop-color="#050506"/>
      <stop offset="0.85" stop-color="#16171b"/>
      <stop offset="1" stop-color="#2a2b31"/>
    </radialGradient>
    <radialGradient id="hub" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#e6e7ea"/>
      <stop offset="0.5" stop-color="#8e929a"/>
      <stop offset="1" stop-color="#2b2c31"/>
    </radialGradient>
    <radialGradient id="keyRed" cx="0%" cy="55%" r="85%">
      <stop offset="0" stop-color="#ff2a17" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#c3150b" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c3150b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <path id="sideArc" d="M 500 500 m -400 0 a 400 400 0 1 1 800 0 a 400 400 0 1 1 -800 0"/>
    <!-- Одна спица: двойная, сужается к ободу -->
    <g id="spokePair">
      <!-- Широкая спица с канавкой посередине, расширяется к ободу -->
      <path d="M 466 418 L 446 214 Q 450 196 470 194 L 530 194 Q 550 196 554 214 L 534 418 Z" fill="url(#spoke)"/>
      <path d="M 497 410 L 494 206 L 506 206 L 503 410 Z" fill="#141418" opacity="0.9"/>
      <path d="M 466 418 L 446 214 Q 450 196 470 194 L 474 194 L 482 418 Z" fill="#ffffff" opacity="0.12"/>
    </g>
    <!-- Блок протектора на плече шины -->
    <path id="lug" d="M 492 10 L 508 10 L 511 42 L 489 42 Z" fill="#1c1c21"/>
    <clipPath id="tireClip"><circle cx="500" cy="500" r="490"/></clipPath>
  </defs>

  <g class="tire-rot">
    <!-- Шина -->
    <circle cx="500" cy="500" r="490" fill="url(#rubber)"/>
    <g fill="#24242a">
      <use href="#lug"/><use href="#lug" transform="rotate(5 500 500)"/><use href="#lug" transform="rotate(10 500 500)"/><use href="#lug" transform="rotate(15 500 500)"/><use href="#lug" transform="rotate(20 500 500)"/><use href="#lug" transform="rotate(25 500 500)"/><use href="#lug" transform="rotate(30 500 500)"/><use href="#lug" transform="rotate(35 500 500)"/><use href="#lug" transform="rotate(40 500 500)"/><use href="#lug" transform="rotate(45 500 500)"/><use href="#lug" transform="rotate(50 500 500)"/><use href="#lug" transform="rotate(55 500 500)"/><use href="#lug" transform="rotate(60 500 500)"/><use href="#lug" transform="rotate(65 500 500)"/><use href="#lug" transform="rotate(70 500 500)"/><use href="#lug" transform="rotate(75 500 500)"/><use href="#lug" transform="rotate(80 500 500)"/><use href="#lug" transform="rotate(85 500 500)"/><use href="#lug" transform="rotate(90 500 500)"/><use href="#lug" transform="rotate(95 500 500)"/><use href="#lug" transform="rotate(100 500 500)"/><use href="#lug" transform="rotate(105 500 500)"/><use href="#lug" transform="rotate(110 500 500)"/><use href="#lug" transform="rotate(115 500 500)"/><use href="#lug" transform="rotate(120 500 500)"/><use href="#lug" transform="rotate(125 500 500)"/><use href="#lug" transform="rotate(130 500 500)"/><use href="#lug" transform="rotate(135 500 500)"/><use href="#lug" transform="rotate(140 500 500)"/><use href="#lug" transform="rotate(145 500 500)"/><use href="#lug" transform="rotate(150 500 500)"/><use href="#lug" transform="rotate(155 500 500)"/><use href="#lug" transform="rotate(160 500 500)"/><use href="#lug" transform="rotate(165 500 500)"/><use href="#lug" transform="rotate(170 500 500)"/><use href="#lug" transform="rotate(175 500 500)"/><use href="#lug" transform="rotate(180 500 500)"/><use href="#lug" transform="rotate(185 500 500)"/><use href="#lug" transform="rotate(190 500 500)"/><use href="#lug" transform="rotate(195 500 500)"/><use href="#lug" transform="rotate(200 500 500)"/><use href="#lug" transform="rotate(205 500 500)"/><use href="#lug" transform="rotate(210 500 500)"/><use href="#lug" transform="rotate(215 500 500)"/><use href="#lug" transform="rotate(220 500 500)"/><use href="#lug" transform="rotate(225 500 500)"/><use href="#lug" transform="rotate(230 500 500)"/><use href="#lug" transform="rotate(235 500 500)"/><use href="#lug" transform="rotate(240 500 500)"/><use href="#lug" transform="rotate(245 500 500)"/><use href="#lug" transform="rotate(250 500 500)"/><use href="#lug" transform="rotate(255 500 500)"/><use href="#lug" transform="rotate(260 500 500)"/><use href="#lug" transform="rotate(265 500 500)"/><use href="#lug" transform="rotate(270 500 500)"/><use href="#lug" transform="rotate(275 500 500)"/><use href="#lug" transform="rotate(280 500 500)"/><use href="#lug" transform="rotate(285 500 500)"/><use href="#lug" transform="rotate(290 500 500)"/><use href="#lug" transform="rotate(295 500 500)"/><use href="#lug" transform="rotate(300 500 500)"/><use href="#lug" transform="rotate(305 500 500)"/><use href="#lug" transform="rotate(310 500 500)"/><use href="#lug" transform="rotate(315 500 500)"/><use href="#lug" transform="rotate(320 500 500)"/><use href="#lug" transform="rotate(325 500 500)"/><use href="#lug" transform="rotate(330 500 500)"/><use href="#lug" transform="rotate(335 500 500)"/><use href="#lug" transform="rotate(340 500 500)"/><use href="#lug" transform="rotate(345 500 500)"/><use href="#lug" transform="rotate(350 500 500)"/><use href="#lug" transform="rotate(355 500 500)"/>
    </g>
    <!-- Рёбра боковины -->
    <circle cx="500" cy="500" r="452" fill="none" stroke="#202026" stroke-width="2"/>
    <circle cx="500" cy="500" r="352" fill="none" stroke="#1f1f25" stroke-width="3"/>
    <text font-family="Unbounded, Arial, sans-serif" font-weight="700" font-size="34" letter-spacing="10" fill="#2e2e35">
      <textPath href="#sideArc" startOffset="3%">ПРОТЕКТОР</textPath>
    </text>
    <text font-family="Unbounded, Arial, sans-serif" font-weight="500" font-size="22" letter-spacing="8" fill="#2a2a31">
      <textPath href="#sideArc" startOffset="53%">R13 — R22 · ШИНОМОНТАЖ</textPath>
    </text>

    <!-- Диск -->
    <circle cx="500" cy="500" r="338" fill="url(#metal)"/>
    <circle cx="500" cy="500" r="326" fill="#1a1b1f"/>
    <circle cx="500" cy="500" r="318" fill="url(#barrel)"/>
    <!-- Тормозной диск и суппорт за спицами -->
    <circle cx="500" cy="500" r="250" fill="#2a2b30"/>
    <circle cx="500" cy="500" r="250" fill="none" stroke="#3d3f46" stroke-width="40" stroke-dasharray="3 9"/>
    <circle cx="500" cy="500" r="150" fill="#1b1c20"/>
  </g>

  <!-- Суппорт не вращается -->
  <path d="M 286 395 A 232 232 0 0 1 395 290 L 418 330 A 186 186 0 0 0 330 414 Z" fill="#c81d14"/>
    <path d="M 300 392 A 220 220 0 0 1 392 304" fill="none" stroke="#ff5a48" stroke-width="3" opacity="0.6"/>

  <g class="tire-rot">
    <g>
      <use href="#spokePair"/>
      <use href="#spokePair" transform="rotate(72 500 500)"/>
      <use href="#spokePair" transform="rotate(144 500 500)"/>
      <use href="#spokePair" transform="rotate(216 500 500)"/>
      <use href="#spokePair" transform="rotate(288 500 500)"/>
    </g>
    <circle cx="500" cy="500" r="104" fill="url(#hub)"/>
    <g fill="#16171b">
      <circle cx="500" cy="448" r="11"/>
      <circle cx="549.5" cy="484" r="11"/>
      <circle cx="530.6" cy="542" r="11"/>
      <circle cx="469.4" cy="542" r="11"/>
      <circle cx="450.5" cy="484" r="11"/>
    </g>
    <circle cx="500" cy="500" r="30" fill="#0f0f12"/>
    <path d="M 487 507 L 493 488 L 516 488 L 510 507 Z" fill="#e3261c"/>
  </g>

  <!-- Свет не вращается вместе с колесом -->
  <g clip-path="url(#tireClip)" pointer-events="none">
    <rect width="1000" height="1000" fill="url(#keyRed)"/>
    <path d="M 70 360 A 440 440 0 0 1 930 360" fill="none" stroke="url(#rimLight)" stroke-width="22" opacity="0.6"/>
  </g>
</svg>
