<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цифры текстом</title>
<meta name="description" content="Цифры компании обычным текстом: строки выезжают по очереди с разных сторон.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;700&family=Montserrat:wght@400;500;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #f1f3f5; --ink: #141414; --ink2: #3c3c3c; --mute: #8b8e92; --pad: 20px; color-scheme: light; }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.6 'Montserrat', system-ui, sans-serif; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  .wrap { max-width: 480px; margin: 0 auto; overflow: hidden; overflow: clip; }
  .top { padding: 140px var(--pad) 20px; text-align: center; }
  .top p { margin: 0; font-size: 13px; color: var(--ink2); }
  .lbl { display: block; margin-bottom: 8px; font: 500 10px/1 'Montserrat'; letter-spacing: .22em; text-transform: uppercase; color: var(--mute); }

  .sc { position: relative; padding: 40px 0 120px; overflow: hidden; background: linear-gradient(#e9ecef, #f4f5f7 30%); }
  .sc > .cl { position: absolute; width: 230%; left: -65%; top: 10%; max-width: none; pointer-events: none; opacity: .9; }
  .sc > .cl.b { top: 55%; left: -45%; width: 210%; transform: scaleX(-1); opacity: .8; }
  .logo { position: relative; z-index: 2; display: block; width: 84%; max-width: 400px; margin: 0 auto 70px; }
  .re { position: fixed; z-index: 6; right: 14px; top: 110px; height: 34px; padding: 0 14px; border-radius: 999px; background: rgba(255, 255, 255, .92); border: 1px solid rgba(20, 20, 20, .14); font: 500 9px 'Montserrat'; letter-spacing: .16em; text-transform: uppercase; }

  .facts { position: relative; z-index: 3; padding: 0 var(--pad); }
  .f { display: flex; align-items: center; gap: 14px; margin-bottom: 64px; }
  .f.r { flex-direction: row-reverse; text-align: right; }
  .f b { font: 700 72px/.85 'Unbounded', sans-serif; letter-spacing: -.045em; font-variant-numeric: tabular-nums; }
  .f i { display: block; font: normal 800 15px/1.15 'Montserrat'; letter-spacing: .08em; text-transform: uppercase; }
  .f span { display: block; margin-top: 4px; font-size: 13px; color: var(--ink2); }
  .f { will-change: transform, opacity; }
  .end { padding: 60px var(--pad) 80px; text-align: center; color: var(--mute); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span class="lbl">Altitude · цифры без плашек</span><p>Листайте вниз: строки выезжают по очереди — слева, справа, слева, справа.</p></header>
  <section class="sc">
    <img class="cl" src="hero/cloud-dense.webp" alt=""><img class="cl b" src="hero/cloud-soft.webp" alt="">
    <img class="logo" src="hero/logo-mark.webp" alt="Altitude">
    <div class="facts">
      <div class="f"><b data-to="12">0</b><div><i>лет</i><span>строим дома под ключ</span></div></div>
      <div class="f r"><b data-to="140">0</b><div><i>домов</i><span>сдали владельцам</span></div></div>
      <div class="f"><b data-to="3">0</b><div><i>ЖК</i><span>сейчас в работе</span></div></div>
      <div class="f r"><b data-to="5">0</b><div><i>лет гарантии</i><span>на конструктив дома</span></div></div>
    </div>
  </section>
  <p class="end">Нравится — поставлю под логотип в основное демо.</p>
</div>
<button class="re" id="re">↺ Ещё раз</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script>
(function () {
  var rows = Array.prototype.slice.call(document.querySelectorAll('.f'));
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { rows.forEach(function (r) { r.querySelector('b').textContent = r.querySelector('b').dataset.to; }); return; }
  gsap.registerPlugin(ScrollTrigger);
  var show = function (r) {
    var from = r.classList.contains('r') ? 120 : -120, n = r.querySelector('b'), to = +n.dataset.to, o = { v: 0 };
    gsap.timeline()
      .fromTo(r, { x: from, opacity: 0 }, { x: 0, opacity: 1, duration: 0.9, ease: 'power3.out' })
      .fromTo(o, { v: 0 }, { v: to, duration: to > 20 ? 1.4 : 0.9, ease: 'power2.out', onUpdate: function () { n.textContent = Math.round(o.v); } }, '-=0.6');
  };
  var reset = function () { rows.forEach(function (r) { gsap.killTweensOf(r); gsap.set(r, { opacity: 0, x: r.classList.contains('r') ? 120 : -120 }); r.querySelector('b').textContent = '0'; r._st && r._st.kill(); r._st = ScrollTrigger.create({ trigger: r, start: 'top 85%', once: true, onEnter: function () { show(r); } }); }); };
  reset();
  document.getElementById('re').onclick = function () { scrollTo(0, 0); setTimeout(function () { reset(); ScrollTrigger.refresh(); }, 50); };
})();
</script>
</body>
</html>
